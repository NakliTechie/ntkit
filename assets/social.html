<!doctype html>
<!-- The GitHub social card. assets/render-social.sh renders this to assets/social.png
     (1280×640). The right half is the BUILD and CLOSE columns of workflow.svg, so the card
     and the README map always agree. -->
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: #ffffff; }
  body { width: 1280px; height: 640px; position: relative; overflow: hidden;
         font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1f2328; }
  .copy { position: absolute; left: 72px; top: 92px; width: 580px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand span { font-size: 54px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .brand i { display: block; width: 14px; height: 38px; border-radius: 2px; background: #0891b2; }
  h1 { margin: 40px 0 0; font-weight: 700; font-size: 44px; line-height: 1.16; letter-spacing: -0.015em; }
  h1 em { font-style: normal; color: #0891b2; white-space: nowrap; }
  p.sub { margin: 24px 0 0; font-size: 22px; line-height: 1.42; color: #656d76; }
  .facts { position: absolute; left: 72px; bottom: 64px; font-size: 15px; font-weight: 600;
           letter-spacing: 0.04em; color: #656d76; text-transform: uppercase; }
  .facts b { color: #0e7490; font-weight: 700; }
  /* The map's right column — BUILD over CLOSE — at the map's own scale (viewBox 1600×930,
     that column at x 1072..1546, rows at y 215..505 and 528..818). */
  .shot { position: absolute; left: 720px; top: 44px; width: 560px; height: 596px; overflow: hidden; }
  .shot img { position: absolute; width: 1600px; left: -1066px; top: -208px; }
  .shot::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 80px;
                 background: linear-gradient(rgba(255,255,255,0), #ffffff); }
</style></head>
<body>
  <div class="copy">
    <div class="brand"><span>ntkit</span><i></i></div>
    <h1>The rigor layer for <em>AI-assisted development.</em></h1>
    <p class="sub">22 Claude Code skills for everything around the code: decisions remembered, sessions resumed, the whole app audited, and "done" only when a verifier says so.</p>
  </div>
  <div class="facts"><b>22 slash commands</b> &nbsp;·&nbsp; every repo &nbsp;·&nbsp; MIT</div>
  <div class="shot"><img src="workflow.svg" alt=""></div>
</body></html>
