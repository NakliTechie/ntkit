<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 990" role="img">
<title>ntkit — when to use what</title>
<desc>A light-mode workflow map of ntkit's 23 Claude Code skills across five phases, plus a daily session loop and a knowledge vault used at every phase.</desc>
<style>
text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.h1{fill:#1f2328;font-size:58px;font-weight:800}
.tag{fill:#656d76;font-size:20px}
.pill{fill:#ecfeff;stroke:#9bdfec;stroke-width:1}
.pilltxt{fill:#0e7490;font-size:16px;font-weight:600}
.loopbox{fill:#ecfeff;stroke:#7cd4e3;stroke-width:1}
.loop{fill:#0e7490;font-size:17px}
.loopb{fill:#0891b2;font-weight:700}
.card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
.num{fill:#0891b2}
.numt{fill:#ffffff;font-size:20px;font-weight:800}
.pname{fill:#1f2328;font-size:25px;font-weight:700}
.pwhen{fill:#656d76;font-size:15px}
.div{stroke:#d8dee4;stroke-width:1}
.cmd{fill:#1f2328;font-size:19px;font-weight:500}
.sl{fill:#0891b2;font-weight:700}
.suf{fill:#98a1ab}
.chev{fill:#c2cbd4;font-size:30px;font-weight:700}
.foot{fill:#656d76;font-size:17px}
.fb{fill:#24292f;font-weight:600}
</style>
<rect width="1600" height="990" fill="#ffffff"/>
<text x="56" y="92" class="h1">ntkit</text>
<rect x="214" y="56" width="15" height="40" rx="2" fill="#0891b2"/>
<text x="58" y="128" class="tag">when to use what  ·  the rigor layer for AI-assisted development</text>
<rect x="1368" y="52" width="176" height="38" rx="19" class="pill"/>
<text x="1456" y="77" class="pilltxt" text-anchor="middle">23 slash commands</text>

<rect x="56" y="150" width="1488" height="40" rx="10" class="loopbox"/>
<text x="80" y="176" class="loop"><tspan class="loopb">↻  The daily loop —</tspan>  /standup → /resume → …work… → /windup,  so every session resumes exactly where the last one left off.</text>

<rect x="56" y="202" width="1488" height="40" rx="10" class="loopbox"/>
<rect x="80" y="215" width="14" height="14" rx="3" fill="#0891b2"/>
<text x="102" y="228" class="loop"><tspan class="loopb">The knowledge vault — used at every phase:</tspan>  /capture-nt save  ·  /ask-nt recall,  so the same question never gets researched twice.</text>

<g transform="translate(56,250)">
<rect width="477" height="326" rx="16" class="card"/>
<circle cx="42" cy="42" r="18" class="num"/><text x="42" y="49" class="numt" text-anchor="middle">1</text>
<text x="74" y="50" class="pname">START</text><text x="74" y="75" class="pwhen">new project, new day, new session</text>
<line x1="24" y1="98" x2="453" y2="98" class="div"/>
<text x="28" y="135" class="cmd"><tspan class="sl">/</tspan>scaffold<tspan class="suf">-nt</tspan>  <tspan class="suf" font-size="15">— bootstrap a new repo</tspan></text>
<text x="28" y="165" class="cmd"><tspan class="sl">/</tspan>standup<tspan class="suf">-nt</tspan>  <tspan class="suf" font-size="15">— cross-repo status</tspan></text>
<text x="28" y="195" class="cmd"><tspan class="sl">/</tspan>resume<tspan class="suf">-nt</tspan>  <tspan class="suf" font-size="15">— pick up this repo</tspan></text>
</g>

<g transform="translate(561,250)">
<rect width="477" height="326" rx="16" class="card"/>
<circle cx="42" cy="42" r="18" class="num"/><text x="42" y="49" class="numt" text-anchor="middle">2</text>
<text x="74" y="50" class="pname">BUILD</text><text x="74" y="75" class="pwhen">do the work, capture the why</text>
<line x1="24" y1="98" x2="453" y2="98" class="div"/>
<text x="28" y="135" class="cmd"><tspan class="sl">/</tspan>decide<tspan class="suf">-nt</tspan></text>
<text x="28" y="165" class="cmd"><tspan class="sl">/</tspan>soc<tspan class="suf">-nt</tspan>  <tspan class="suf" font-size="15">— stream-of-consciousness</tspan></text>
<text x="28" y="195" class="cmd"><tspan class="sl">/</tspan>autopilot<tspan class="suf">-nt</tspan>  <tspan class="suf" font-size="15">— executes batches, attended or away</tspan></text>
<text x="28" y="225" class="cmd"><tspan class="sl">/</tspan>lab<tspan class="suf">-nt</tspan>  <tspan class="suf" font-size="15">— research legs toward a falsifiable metric</tspan></text>
</g>

<g transform="translate(1066,250)">
<rect width="477" height="326" rx="16" class="card"/>
<circle cx="42" cy="42" r="18" class="num"/><text x="42" y="49" class="numt" text-anchor="middle">3</text>
<text x="74" y="50" class="pname">REVIEW</text><text x="74" y="75" class="pwhen">audit cold, plan the fixes</text>
<line x1="24" y1="98" x2="453" y2="98" class="div"/>
<text x="28" y="135" class="cmd"><tspan class="sl">/</tspan>forward-pass<tspan class="suf">-nt</tspan></text>
<text x="28" y="162" class="cmd"><tspan class="sl">/</tspan>walkthrough<tspan class="suf">-nt</tspan></text>
<text x="28" y="189" class="cmd"><tspan class="sl">/</tspan>ux-review<tspan class="suf">-nt</tspan></text>
<text x="28" y="216" class="cmd"><tspan class="sl">/</tspan>maintain<tspan class="suf">-nt</tspan></text>
<text x="28" y="243" class="cmd"><tspan class="sl">/</tspan>reclaim<tspan class="suf">-nt</tspan></text>
<text x="28" y="270" class="cmd"><tspan class="sl">/</tspan>live-check<tspan class="suf">-nt</tspan>  <tspan class="suf" font-size="14">— the replay gate</tspan></text>
<text x="28" y="297" class="cmd"><tspan class="sl">/</tspan>harden<tspan class="suf">-nt</tspan>  <tspan class="suf" font-size="14">— adversarial rounds</tspan></text>
</g>

<text x="547" y="425" class="chev">›</text><text x="1052" y="425" class="chev">›</text>

<g transform="translate(56,616)">
<rect width="730" height="326" rx="16" class="card"/>
<circle cx="42" cy="42" r="18" class="num"/><text x="42" y="49" class="numt" text-anchor="middle">4</text>
<text x="74" y="50" class="pname">SHIP</text><text x="74" y="75" class="pwhen">demo, document, release</text>
<line x1="24" y1="98" x2="706" y2="98" class="div"/>
<text x="28" y="135" class="cmd"><tspan class="sl">/</tspan>guide<tspan class="suf">-nt</tspan>  <tspan class="suf" font-size="15">— single-file searchable HTML guide</tspan></text>
<text x="28" y="165" class="cmd"><tspan class="sl">/</tspan>demo<tspan class="suf">-nt</tspan>  <tspan class="suf" font-size="15">— interactive feature explorer</tspan></text>
<text x="28" y="195" class="cmd"><tspan class="sl">/</tspan>package<tspan class="suf">-nt</tspan>  <tspan class="suf" font-size="15">— readiness gate + drafted posts</tspan></text>
<text x="28" y="225" class="cmd"><tspan class="sl">/</tspan>release<tspan class="suf">-nt</tspan>  <tspan class="suf" font-size="15">— semver, tag, verify it landed live</tspan></text>
</g>

<g transform="translate(814,616)">
<rect width="730" height="326" rx="16" class="card"/>
<circle cx="42" cy="42" r="18" class="num"/><text x="42" y="49" class="numt" text-anchor="middle">5</text>
<text x="74" y="50" class="pname">CLOSE</text><text x="74" y="75" class="pwhen">save state, hand off</text>
<line x1="24" y1="98" x2="706" y2="98" class="div"/>
<text x="28" y="135" class="cmd"><tspan class="sl">/</tspan>windup<tspan class="suf">-nt</tspan>  <tspan class="suf" font-size="15">— day summary, commit, tomorrow's brief</tspan></text>
<text x="28" y="165" class="cmd"><tspan class="sl">/</tspan>replan<tspan class="suf">-nt</tspan>  <tspan class="suf" font-size="15">— fold plan/ back into the three canonical files</tspan></text>
<text x="28" y="195" class="cmd"><tspan class="sl">/</tspan>notify<tspan class="suf">-nt</tspan>  <tspan class="suf" font-size="15">— desktop + phone ping when a run finishes</tspan></text>
</g>

<text x="790" y="779" class="chev">›</text>

<text x="1544" y="962" class="foot" text-anchor="end">github.com/NakliTechie/ntkit  ·  MIT</text>
</svg>
