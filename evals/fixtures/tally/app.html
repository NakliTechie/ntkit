<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tally</title><link rel="stylesheet" href="styles.css"></head>
<body><main>
  <h1>Tally</h1>
  <form id="add"><input id="name" placeholder="What are you counting?" aria-label="Counter name" required>
    <button type="submit">Add counter</button></form>
  <ul id="counters"></ul>
  <p class="empty" id="empty">No counters yet. Name one above.</p>
  <button class="quiet" id="export">Export CSV</button>
</main><script src="app.js"></script></body></html>
